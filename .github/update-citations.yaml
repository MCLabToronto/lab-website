name: update-publications
run-name: update publications from Google Scholar

on:
  # Allow this workflow to be called by another workflow
  workflow_call:
    outputs:
      changed:
        description: Whether the publication database changed
        value: ${{ jobs.update-publications.outputs.changed }}

  # Also allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

env:
  GOOGLE_SCHOLAR_API_KEY: ${{ secrets.GOOGLE_SCHOLAR_API_KEY }}

jobs:
  update-publications:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      changed: ${{ steps.changed.outputs.files_changed }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "_cite/requirements.txt"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement _cite/requirements.txt

      - name: Update publications from Google Scholar
        run: |
          python _cite/update_publications.py

      - name: Check whether publications changed
        id: changed
        uses: tj-actions/verify-changed-files@v18
        with:
          files: |
            _data/citations.yaml

      - name: Commit updated publications
        if: steps.changed.outputs.files_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: "_data/citations.yaml"
          commit_message: "Update publications from Google Scholar"
