name: update-publications
run-name: update publications from member Google Scholar profiles

on:
  workflow_call:
    outputs:
      changed:
        description: Whether the publication database changed
        value: ${{ jobs.update-publications.outputs.changed }}

  workflow_dispatch:

permissions:
  contents: write

env:
  GOOGLE_SCHOLAR_API_KEY: ${{ secrets.GOOGLE_SCHOLAR_API_KEY }}

jobs:
  update-publications:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      changed: ${{ steps.check-changes.outputs.changed }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "_cite/requirements.txt"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement _cite/requirements.txt

      - name: Update publications from member Google Scholar profiles only
        run: |
          python _cite/update_publications.py

      - name: Check whether publications changed
        id: check-changes
        shell: bash
        run: |
          if git diff --quiet -- _data/citations.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No publication changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Publication changes detected."
          fi

      - name: Commit updated publications directly to main
        if: steps.check-changes.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: "_data/citations.yaml"
          commit_message: "Update publications from member Google Scholar profiles"
