name: weekly-publication-update
run-name: weekly Google Scholar publication update

on:
  # Every Monday at 12:00 UTC
  #
  # Approximately:
  # 8:00 AM Toronto during daylight saving time
  # 7:00 AM Toronto during standard time
  schedule:
    - cron: "0 12 * * 1"

  # Allow manual runs from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-publications:
    uses: ./.github/workflows/update-citations.yaml
    secrets: inherit

  build-site:
    needs:
      - update-publications

    # No need to rebuild when Scholar returned exactly the
    # same publication database.
    if: needs.update-publications.outputs.changed == 'true'

    uses: ./.github/workflows/build-site.yaml
